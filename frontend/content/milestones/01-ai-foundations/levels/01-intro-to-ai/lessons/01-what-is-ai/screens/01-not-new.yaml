id: "01-notnew"
title: "AI is Not New!"
hero:
  type: "image"
  src: "/content/images/ai-welcome.svg"
  alt: "Abstract representation of artificial intelligence with neural network patterns"
  sync_points:
    - word_index: 5
      action: "highlight"
    - word_index: 12
      action: "animate"
transcript: |
  When you type a message on your phone, the keyboard suggests you
  the next word. Did you know that's AI?
  
  AI is not distant future, it's actually all around you! Your
  Netfli recommendations? AI.

  How does Spotify find you good music and how does Shazam know
  the songs? AI.

  Gmail is really good at keeping away spam and showing you what's important. And that AI is very old.

  My voice? Also, AI. 
estimated_duration_seconds: 15
