id: "02-narrow-vs-general"
title: "Narrow vs General AI"
hero:
  type: "animated-svg"
  src: "/content/images/narrow-vs-general.svg"
  animation_config:
    autoplay: true
    loop: false
  sync_points:
    - word_index: 3
      action: "trigger"
      target: "narrow-ai"
    - word_index: 15
      action: "trigger"
      target: "general-ai"
transcript: |
  AI created & trained for a specific task like Netflix recommendations or catching spam in email is good only for that task. That is called Narrow AI.
  
  General AI, or Strong AI, would have human-like intelligence across any task. This remains theoretical and doesn't exist yet.
  
  This is the new world we are entring where AI gets better everyday.
checkpoint_quiz:
  question_ref: "questions/q02-narrow-vs-general.yaml"
  required_to_pass: true
  allow_skip: false
estimated_duration_seconds: 10
