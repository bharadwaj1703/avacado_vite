id: "q03-ai-examples"
type: "many-of-many"
prompt: "Which of the following are examples of Narrow AI currently in use? (Select all that apply)"
options:
  - id: "siri"
    text: "Siri and Alexa voice assistants"
  - id: "chess"
    text: "Chess-playing computers like Deep Blue"
  - id: "self-driving"
    text: "Fully autonomous self-driving cars (Level 5)"
  - id: "recommendations"
    text: "Netflix and Spotify recommendation systems"
  - id: "spam"
    text: "Email spam filters"
  - id: "thinking"
    text: "AI that can think and reason like humans"
correct_options:
  - "siri"
  - "chess"
  - "recommendations"
  - "spam"
passing_rule: "at-least-k"
min_required: 3
partial_credit: true
render_as: "checkboxes"
explanation: "Voice assistants, chess computers, recommendation systems, and spam filters are all examples of Narrow AI - systems designed for specific tasks. Fully autonomous self-driving cars and human-level thinking AI (General AI) do not yet exist."
points: 2
