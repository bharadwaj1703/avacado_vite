services:
  # Backend API Service
  - type: web
    name: avacado-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3001
      - key: DATABASE
        sync: false
      - key: DATABASE_TURSO_AUTH_TOKEN
        sync: false
      - key: DATABASE_TURSO_DATABASE_URL
        sync: false
      - key: SQLITE_DB_PATH
        value: /data/avacado.sqlite
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_BACKEND_API_URL
        value: https://api.clerk.com
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AI_MODEL_MAX_INPUT_PRICE_PER_MTOK
        value: 1.00
      - key: AI_MODEL_MAX_OUTPUT_PRICE_PER_MTOK
        value: 2.5
      - key: TTS_STORAGE
        value: local
      - key: TTS_PROVIDER
        value: gemini
      - key: TTS_VOICE
        value: Fenrir
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_S3_PUBLIC_URL
        sync: false
    disk:
      name: avacado-data
      mountPath: /data
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: avacado-frontend
    runtime: static
    buildCommand: cd frontend && bun install && bun run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: avacado-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_FRONTEND_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://avacado-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
