services:
  # Full-stack service (Backend + Frontend)
  - type: web
    name: avacado-app
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE
        sync: false
      - key: DATABASE_TURSO_AUTH_TOKEN
        sync: false
      - key: DATABASE_TURSO_DATABASE_URL
        sync: false
      - key: SQLITE_DB_PATH
        value: /data/avacado.sqlite
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_BACKEND_API_URL
        value: https://api.clerk.com
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AI_MODEL_MAX_INPUT_PRICE_PER_MTOK
        value: 1.00
      - key: AI_MODEL_MAX_OUTPUT_PRICE_PER_MTOK
        value: 2.5
      - key: TTS_STORAGE
        value: local
      - key: TTS_PROVIDER
        value: gemini
      - key: TTS_VOICE
        value: Fenrir
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_S3_PUBLIC_URL
        sync: false
    disk:
      name: avacado-data
      mountPath: /data
      sizeGB: 1
